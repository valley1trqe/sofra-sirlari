<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim — Sofra Sırları</title>
  <meta name="description" content="Sorularınız, önerileriniz ve iş birlikleri için Sofra Sırları ile iletişime geçin.">
  <link rel="canonical" href="https://sofrasirlari.com.tr/iletisim.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header-mount"></div>
  <div class="page-hero"><div class="container">
    <div class="breadcrumb"><a href="index.html">Ana Sayfa</a> / İletişim</div>
    <h1>✉️ İletişim</h1>
    <p>Görüş, öneri ve iş birlikleriniz için bize yazın.</p>
  </div></div>
  <section class="section"><div class="container">
     <div class="contact-grid">
      <form class="contact-form" data-demo-form="Mesajınız gönderildi! En kısa sürede dönüş yapacağız.">
        <div><label>Ad Soyad</label><input type="text" required placeholder="Adınız Soyadınız"></div>
        <div><label>E-posta</label><input type="email" required placeholder="ornek@email.com"></div>
        <div><label>Konu</label>
          <select required>
            <option value="">Konu seçin</option>
            <option>Genel Soru</option>
            <option>Tarif Önerisi</option>
            <option>İş Birliği</option>
            <option>Hata Bildirimi</option>
          </select>
        </div>
        <div><label>Mesaj</label><textarea rows="6" required placeholder="Mesajınızı yazın..."></textarea></div>
        <button class="btn" type="submit">Gönder</button>
      </form>
      <div>
        <div class="info-card">
          <div class="row"><div class="ico">📧</div><div><strong>E-posta</strong><br>iletisim@sofrasirlari.com.tr</div></div>
          <div class="row"><div class="ico">🤝</div><div><strong>İş Birliği</strong><br>isbirligi@sofrasirlari.com.tr</div></div>
          <div class="row"><div class="ico">📱</div><div><strong>Sosyal Medya</strong><br>@sofrasirlari</div></div>
          <div class="social-row" style="margin-top:8px;">
            <a href="#" style="background:var(--color-primary);color:#fff;" aria-label="Instagram">📷</a>
            <a href="#" style="background:var(--color-primary);color:#fff;" aria-label="YouTube">▶️</a>
            <a href="#" style="background:var(--color-primary);color:#fff;" aria-label="Pinterest">📌</a>
          </div>
        </div>
        <div class="ad-slot ad-inline" style="margin-top:24px;min-height:250px;">REKLAM ALANI<small>300×250</small></div>
      </div>
    </div>
  </div></section>
  <div id="site-footer-mount"></div>
  <script src="js/recipes-data.js"></script>
  <script src="js/site.js"></script>
  
</body>
</html>
